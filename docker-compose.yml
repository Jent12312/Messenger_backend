version: '3.8'
services:
  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy # Ждем, пока Postgres станет здоровым
      redis:
        condition: service_started
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=messenger_user
      - DB_PASS=secretpassword
      - DB_NAME=messenger_db

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: messenger_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: messenger_db
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    # Добавляем проверку готовности базы:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger_user -d messenger_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine

volumes:
  pg_data:
